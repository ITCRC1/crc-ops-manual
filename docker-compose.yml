# Uso local únicamente (desarrollo en Windows). No refleja infraestructura remota.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crc_ops_manual
    ports:
      - "5432:5432"
    volumes:
      - crc_ops_manual_db:/var/lib/postgresql/data

volumes:
  crc_ops_manual_db:
