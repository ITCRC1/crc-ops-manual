[tool.ruff]
line-length = 110
target-version = "py311"
# Las migraciones de Alembic son autogeneradas; no se lintean por longitud de línea.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
